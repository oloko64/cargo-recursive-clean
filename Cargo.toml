[package]
name = "cargo-recursive-clean"
version = "0.3.100"
edition = "2024"
authors = ["OLoKo64 <reinaldorozatoj.11cg1@aleeas.com>"]
description = "A CLI app that cleans all Rust projects recursively given a base directory."
categories = ["command-line-utilities"]
keywords = ["cargo", "clean", "recursive"]
repository = "https://github.com/OLoKo64/cargo-recursive-clean"
license = "MIT"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = true
strip = true

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
itertools = "0.15.0"
owo-colors = "4.4.0"
rayon = "1.11.0"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "process",
] }
toml = "1.2.1"
wax = "0.7.0"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "discovery"
harness = false
